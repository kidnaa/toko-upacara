name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-database-password-123456
      JWT_SECRET: ci-only-jwt-secret-for-validation-not-production-123456
      OWNER_PASSWORD: ci-only-owner-bootstrap-password
      STAFF_PASSWORD: ci-only-staff-bootstrap-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install API dependencies
        working-directory: server
        run: npm ci

      - name: Type-check API
        working-directory: server
        run: npx tsc --noEmit

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build
